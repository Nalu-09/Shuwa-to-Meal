<body>
  <div class="wrap">
    <div class="box">
      <h1 class="title">しゅわっとみーる</h1>
      <p class="subtitle">参加者管理 / 日程別確認</p>

      <div id="pageStatus" class="status">LIFF初期化中...</div>

      <div class="menu">
  <button
    id="reservationButton"
    onclick="loadReservations()"
    disabled
  >
    予約管理
  </button>

  <button
    id="serviceManagementButton"
    onclick="openServiceManagement()"
    style="display:none;"
  >
    予約枠管理
  </button>
</div>

      <div id="reservation" class="panel">
        <h2>Reservation</h2>
        <div id="reservationList" class="status">読み込み前です。</div>
      </div>
    </div>

    <div
  id="serviceManagement"
  class="panel"
>

  <h2>Schedule</h2>


  <!-- =========================
       新規予約枠
  ========================== -->
  <div class="service-management-section">

    <div class="service-management-title">
      新規予約枠
    </div>


    <!-- 開催日 -->
    <label class="form-label">
      開催日
    </label>

    <input
      type="date"
      id="slotEventDate"
      class="service-form-control"
    >


    <!-- 会場 -->
    <label class="form-label">
      会場
    </label>

    <select
      id="slotVenue"
      class="service-form-control"
      onchange="handleVenueChange()"
    >
      <option value="">
        会場を選択
      </option>
    </select>


    <!-- プログラム -->
    <label class="form-label">
      プログラム
    </label>

    <div
      id="slotProgramList"
      class="slot-program-list"
    >
      <div class="slot-program-empty">
        会場を選択してください。
      </div>
    </div>


    <!-- LINE先行公開 -->
    <label class="form-label">
      LINE先行公開
    </label>

    <div class="publish-row">

      <input
        type="date"
        id="slotLinePublishDate"
        class="service-form-control"
      >

      <input
        type="time"
        id="slotLinePublishTime"
        class="service-form-control"
      >

    </div>

    <div class="publish-note">
      公開時間が空欄の場合は、指定日の0:00から公開されます。
    </div>


    <!-- Web一般公開 -->
    <label class="form-label">
      Web一般公開
      <span class="optional-label">
        ※任意
      </span>
    </label>

    <div class="publish-row">

      <input
        type="date"
        id="slotWebPublishDate"
        class="service-form-control"
      >

        type="time"
        id="slotWebPublishTime"
        class="service-form-control"
      >

    </div>

    <div class="publish-note">
      公開日が空欄の場合はWebでは公開されません。<br>
      公開時間が空欄の場合は、指定日の0:00から公開されます。
    </div>


    <div
      id="serviceCreateResult"
      class="service-create-result"
    ></div>


    <button
      type="button"
      class="service-save-button"
      onclick="createServiceSlot()"
    >
      予約枠を追加
    </button>

  </div>


  <!-- =========================
       既存予約枠
       代表・運営のみ表示
  ========================== -->
  <div
    id="existingServiceSection"
    class="service-management-section"
    style="display:none;"
  >

    <div class="service-management-title">
      既存予約枠
    </div>

    <div
      id="existingServiceList"
    ></div>

  </div>

</div>
</div>
  </div>

  <script>
    const LIFF_ID = "2007730715-DyW80WjD";
    const API_URL = "https://script.google.com/macros/s/AKfycbxoUCShYsMc8J0cPEwIU0JPrCIKgoT-zHYxWZ_w6T8tqchdRnemhDr1CEexbVa-aDMRDA/exec";

    let currentProfile = null;
    let allReservations = [];
    let lastScrollY = 0;
    let serviceManagementData = null;

    async function initLiff() {
      const pageStatus = document.getElementById("pageStatus");
      const reservationButton = document.getElementById("reservationButton");

      try {
        pageStatus.textContent = "LIFF初期化中...";

        await liff.init({
          liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
          pageStatus.textContent = "LINEログインへ移動します...";
          liff.login();
          return;
        }

        currentProfile = await liff.getProfile();

        pageStatus.textContent = "";
reservationButton.disabled = false;

await preloadServiceManagement();

      } catch (err) {
        pageStatus.textContent =
          "LIFFの初期化に失敗しました。\n" +
          err.message;

        reservationButton.disabled = true;
      }
    }

    async function preloadServiceManagement() {
  const button =
    document.getElementById(
      "serviceManagementButton"
    );

  if (
    !currentProfile ||
    !currentProfile.userId
  ) {
    return;
  }

  try {
    const res = await fetch(API_URL, {
      method: "POST",

      body: new URLSearchParams({
        action:
          "getServiceManagementData",

        adminUserId:
          currentProfile.userId
      })
    });

    const data =
      await res.json();

    /*
     * 調理補助はここでpermission_denied
     * → ボタン自体を表示しない
     */
    if (!data.ok) {
  button.style.display = "none";
  serviceManagementData = null;

  if (data.message === "permission_denied") {
    return;
  }

  const pageStatus =
    document.getElementById("pageStatus");

  pageStatus.textContent =
    "予約枠管理を取得できませんでした：" +
    (data.message || "");

  return;
}

const permissions =
  data.permissions || {};

if (!permissions.createSchedule) {
  button.style.display = "none";
  serviceManagementData = null;
  return;
}

serviceManagementData = data;
button.style.display = "block";

  } catch (err) {
  button.style.display = "none";

  const pageStatus =
    document.getElementById("pageStatus");

  pageStatus.textContent =
    "予約枠管理エラー：" +
    err.message;
}
}

    function showPanel(id) {
      const panels = document.querySelectorAll(".panel");

      panels.forEach(function(panel) {
        panel.classList.remove("active");
      });

      const target = document.getElementById(id);

      if (target) {
        target.classList.add("active");
      }
    }

    async function loadReservations() {
      showPanel("reservation");

      const list = document.getElementById("reservationList");
      list.className = "status";
      list.textContent = "参加者履歴を読み込み中...";

      if (!currentProfile || !currentProfile.userId) {
        list.textContent =
          "LINEユーザー情報を取得できていません。\n" +
          "ページを開き直してください。";
        return;
      }

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: new URLSearchParams({
            action: "getReservations",
            adminUserId: currentProfile.userId
          })
        });

        const data = await res.json();

        if (!data.ok) {
          if (data.message === "admin_only") {
            list.textContent =
              "このページは運営のみ閲覧できます。\n" +
              "閲覧権限がありません。";
            return;
          }

          list.textContent =
            "参加者履歴を取得できませんでした。\n" +
            (data.message || "");
          return;
        }

        const permissions =
  data.permissions || {};

const canViewDetails =
  Boolean(
    permissions.viewParticipantDetails
  );

const programSummaries =
  filterFutureReservations(
    data.programSummaries || []
  );

allReservations =
  filterFutureReservations(
    data.reservations || []
  );

if (programSummaries.length === 0) {
  list.textContent =
    "今日以降の予約はありません。";
  return;
}

/*
 * 全スタッフ共通：
 * 人数・嗜好NGの一覧を表示
 */
renderProgramSummaries(
  programSummaries,
  canViewDetails
);

      } catch (err) {
        list.textContent =
          "参加者履歴の取得中にエラーが発生しました。\n" +
          err.message;
      }
    }
    
    function findReservationGroupIndex(
  date,
  program
) {
  const groups =
    window.reservationGroups || [];

  return groups.findIndex(
    function(group) {
      return (
        group.date === date &&
        group.program === program
      );
    }
  );
}

    function renderProgramSummaries(
  summaries,
  canViewDetails
) {
  const list =
    document.getElementById("reservationList");

  list.className = "";

  window.currentProgramSummaries =
    summaries;

  window.currentCanViewDetails =
    canViewDetails;

  /*
   * 運営補助以上の詳細表示用グループを先に作る
   */
  if (canViewDetails) {
    buildReservationGroups();
  }

  const groupedByDate = {};

  summaries.forEach(function(item) {
    const date =
      item.date || "日程未設定";

    if (!groupedByDate[date]) {
      groupedByDate[date] = [];
    }

    groupedByDate[date].push(item);
  });

  const dates =
    Object.keys(groupedByDate).sort();

  let html =
    `<div class="summary-list">`;

  dates.forEach(function(date) {
    html += `
      <div class="summary-date">
        ${escapeHtml(date)}
      </div>
    `;

    const programs =
      groupedByDate[date];

    programs.sort(function(a, b) {
      return (
        programOrder(a.program) -
        programOrder(b.program)
      );
    });

    programs.forEach(function(item) {
      const program =
        item.program || "参加部未設定";

      const people =
        Number(item.people || 0);

      const allergies =
        Array.isArray(item.allergies)
          ? item.allergies
          : [];

      let allergyHtml = "";

      if (allergies.length === 0) {

    function programOrder(program) {
      if (program === "第1部") return 1;
      if (program === "第2部") return 2;
      if (program === "特別会") return 3;
      return 99;
    }

    function hasText(value) {
      if (value === null || value === undefined) {
        return false;
      }

      const text = String(value)
        .replace(/\s/g, "")
        .trim();

      if (!text) return false;
      if (text === "なし") return false;
      if (text === "無し") return false;
      if (text === "-") return false;
      if (text === "特になし") return false;

      return true;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
    
    function escapeJs(str) {
  return String(str || "")
    .replaceAll("\\", "\\\\")
    .replaceAll("'", "\\'")
    .replaceAll('"', '\\"')
    .replaceAll("\n", "\\n")
    .replaceAll("\r", "");
}

    function filterFutureReservations(reservations) {
      const today = getTodayDateOnly();

      return reservations.filter(function(r) {
        const target = parseDateOnly(r.date);

        if (!target) {
          return false;
        }

        return target.getTime() >= today.getTime();
      });
    }

    function getTodayDateOnly() {
      const now = new Date();

      return new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );
    }

    function parseDateOnly(value) {
      if (!value) {
        return null;
      }

      const str = String(value)
        .trim()
        .replaceAll("-", "/");

      const parts = str.split("/");

      if (parts.length < 3) {
        return null;
      }

      const year = Number(parts[0]);
      const month = Number(parts[1]);
      const day = Number(parts[2]);

      if (!year || !month || !day) {
        return null;
      }

      return new Date(year, month - 1, day);
    }

            type="checkbox"
            class="slot-program-checkbox"
            onchange="handleProgramCheck(this)"
          >

          <div class="slot-program-info">

            <div class="slot-program-name">
              ${escapeHtml_(programName)}
            </div>

            <div class="slot-program-time">
              ${escapeHtml_(startTime)}
              〜
              ${escapeHtml_(endTime)}
            </div>

          </div>

        </div>


        <div class="slot-program-settings">

          <div class="slot-program-setting-grid">

            <div>

              <label class="slot-small-label">
                上限人数
              </label>

              <input
                type="number"
                class="service-form-control slot-capacity"
                min="1"
                value="${escapeHtml_(capacity)}"
              >

            </div>


            <div>

              <label class="slot-small-label">
                料金
              </label>

              <input
                type="number"
                class="service-form-control slot-price"
                min="0"
                value="${escapeHtml_(price)}"
              >

            </div>

          </div>


          <div class="slot-web-setting">

            <label class="slot-web-checkbox-row">

              <input
                type="checkbox"
                class="slot-web-enabled"
                ${isDefaultWebProgram_(programName)
                  ? "checked"
                  : ""}
              >

              Web一般公開する

            </label>

          </div>

        </div>
      `;


      container.appendChild(
        card
      );

    }
  );
}

    async function createServiceSlot() {

  if (
    !currentProfile ||
    !currentProfile.userId
  ) {
    alert(
      "スタッフ情報を取得できませんでした。"
    );

    return;
  }


  const eventDate =
    document.getElementById(
      "slotEventDate"
    ).value;


  const venueId =
    document.getElementById(
      "slotVenue"
    ).value;


  const linePublishDate =
    document.getElementById(
      "slotLinePublishDate"
    ).value;


  const linePublishTime =
    document.getElementById(
      "slotLinePublishTime"
    ).value;


  const webPublishDate =
    document.getElementById(
      "slotWebPublishDate"
    ).value;


  const webPublishTime =
    document.getElementById(
      "slotWebPublishTime"
    ).value;


  /*
   * 必須
   */
  if (!eventDate) {
    alert(
      "開催日を入力してください。"
    );

    return;
  }


  if (!venueId) {
    alert(
      "会場を選択してください。"
    );

    return;
  }


  /*
   * 選択されたプログラム取得
   */
  const selectedCards =
    Array.from(
      document.querySelectorAll(
        ".slot-program-card"
      )
    ).filter(function(card) {

      const checkbox =
        card.querySelector(
          ".slot-program-checkbox"
        );

      return (
        checkbox &&
        checkbox.checked
      );

    });


  if (!selectedCards.length) {
    alert(
      "プログラムを1つ以上選択してください。"
    );

    return;
  }


  const programs = [];


  for (
    const card of selectedCards
  ) {

    const programId =
      card.dataset.programId || "";


    const startTime =
      card.dataset.startTime || "";


    const endTime =
      card.dataset.endTime || "";


    const capacity =
      card.querySelector(
        ".slot-capacity"
      ).value;


    const price =
      card.querySelector(
        ".slot-price"
      ).value;


    const webEnabled =
      card.querySelector(
        ".slot-web-enabled"
      ).checked;


    if (
      !capacity ||
      Number(capacity) <= 0
    ) {
      alert(
        "上限人数を確認してください。"
      );

      return;
    }


    if (
      price === "" ||
      Number(price) < 0
    ) {
      alert(
        "料金を確認してください。"
      );

      return;
    }


    programs.push({
      programId:
        programId,

      startTime:
        startTime,

      endTime:
        endTime,

      capacity:
        Number(capacity),

      price:
        Number(price),

      webEnabled:
        webEnabled
    });
  }


  const resultBox =
    document.getElementById(
      "serviceCreateResult"
    );


  resultBox.textContent =
    "保存中...";


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          body:
            new URLSearchParams({

              action:
                "createServiceSlot",

              adminUserId:
                currentProfile.userId,

              eventDate:
                eventDate,

              venueId:
                venueId,

              programsJson:
                JSON.stringify(
                  programs
                ),

              linePublishDate:
                linePublishDate,

              linePublishTime:
                linePublishTime,

              webPublishDate:
                webPublishDate,

              webPublishTime:
                webPublishTime
            })
        }
      );


    const data =
      await response.json();


    if (!data.ok) {

      resultBox.textContent =
        "保存できませんでした：" +
        (
          data.message ||
          ""
        );

      return;
    }


    resultBox.textContent =
      data.createdCount +
      "件の予約枠を追加しました。";


    /*
     * 最新データ再取得
     */
    await preloadServiceManagement();


    /*
     * 入力リセット
     */
    document.getElementById(
      "slotEventDate"
    ).value = "";

    document.getElementById(
      "slotVenue"
    ).value = "";

    document.getElementById(
      "slotLinePublishDate"
    ).value = "";

    document.getElementById(
      "slotLinePublishTime"
    ).value = "";

    document.getElementById(
      "slotWebPublishDate"
    ).value = "";

    document.getElementById(
      "slotWebPublishTime"
    ).value = "";


    document.getElementById(
      "slotProgramList"
    ).innerHTML =
      '<div class="slot-program-empty">' +
      '会場を選択してください。' +
      '</div>';


    /*
     * 代表・運営のみ
     * 既存予約枠更新
     */
    const permissions =
      serviceManagementData
        ? (
          serviceManagementData
            .permissions || {}
        )
        : {};


    if (
      permissions.editSchedule
    ) {
      renderExistingServices();
    }


  } catch (err) {

    resultBox.textContent =
      "通信エラー：" +
      err.message;

  }
}

    function normalizeTimeForInput_(value) {
  if (!value) {
    return "";
  }

  const text =
    String(value).trim();

  /*
   * すでに HH:mm
   */
  const match =
    text.match(
      /^(\d{1,2}):(\d{2})/
    );

  if (match) {
    return (
      String(match[1])
        .padStart(2, "0") +
      ":" +
      match[2]
    );
  }

  return "";
}

  function handleProgramCheck(
  checkbox
) {
  const card =
    checkbox.closest(
      ".slot-program-card"
    );

  if (!card) {
    return;
  }


  if (checkbox.checked) {
    card.classList.add(
      "selected"
    );
  } else {
    card.classList.remove(
      "selected"
    );
  }
}

    function isDefaultWebProgram_(
  programName
) {
  const name =
    String(
      programName || ""
    ).trim();

  return [
    "第1部",
    "第2部",
    "両方"
  ].includes(name);
}

) {

    );

  if (match) {
    return (
      String(
        match[1]
      ).padStart(
        2,
        "0"
      ) +

    );
  }

  return "";
}

    function escapeHtml_(value) {
  return String(
    value == null
      ? ""
      : value
  )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
